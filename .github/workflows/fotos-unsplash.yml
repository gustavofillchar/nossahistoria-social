name: Fotos do Unsplash (sob demanda)

# Não publica nada. Só baixa fotos para usar nos reels.
# Uso: edite fotos/pedidos.json  {"nome": {"query": "couple holding hands sunset", "orientation": "portrait", "n": 4}}
# e dê push. As fotos caem em fotos/<nome>-1.jpg ... e os créditos em fotos/creditos.json.
on:
  push:
    paths: ["fotos/pedidos.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar e baixar no Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ["UNSPLASH_ACCESS_KEY"]
          H = {"Authorization": f"Client-ID {key}", "Accept-Version": "v1", "User-Agent": "nossahistoria bot"}
          def get(url, headers=H):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60).read()
          pedidos = json.load(open("fotos/pedidos.json"))
          cred_path = "fotos/creditos.json"
          creditos = json.load(open(cred_path)) if os.path.exists(cred_path) else {}
          for nome, p in pedidos.items():
              if os.path.exists(f"fotos/{nome}-1.jpg"):
                  continue
              q = urllib.parse.urlencode({"query": p["query"], "orientation": p.get("orientation", "portrait"),
                                          "content_filter": "high", "per_page": p.get("n", 4)})
              try:
                  res = json.loads(get(f"https://api.unsplash.com/search/photos?{q}"))["results"]
              except Exception as e:  # chave demo do Unsplash: 50 requisições por hora
                  print(nome, "falhou:", e)
                  continue
              print(nome, len(res), "resultados")
              for i, ph in enumerate(res, 1):
                  try:  # exigência da API do Unsplash: registrar o download
                      get(ph["links"]["download_location"])
                  except Exception:
                      pass
                  url = ph["urls"]["raw"] + "&w=1600&q=85&fm=jpg"
                  open(f"fotos/{nome}-{i}.jpg", "wb").write(get(url, {"User-Agent": "nossahistoria bot"}))
                  creditos[f"{nome}-{i}"] = {"id": ph["id"], "autor": ph["user"]["name"],
                                             "link": ph["links"]["html"], "descricao": ph.get("alt_description")}
          json.dump(creditos, open(cred_path, "w"), indent=1, ensure_ascii=False)
          PY
      - name: Salvar no repositório
        run: |
          git config user.name "nossahistoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fotos
          git diff --cached --quiet || (git commit -m "Fotos do Unsplash" && git pull --rebase -q && git push)
