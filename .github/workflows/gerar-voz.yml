name: Gerar voz

# Roda quando um voz/<slug>.json é criado ou alterado (o Claude faz isso ao montar um reel narrado)
on:
  push:
    paths: ["voz/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-voz
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar falas na ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/gerar_voz.py
      - name: Salvar áudios
        run: |
          git config user.name "nossahistoria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voz
          if ! git diff --cached --quiet; then
            git commit -m "Falas geradas na ElevenLabs"
            git pull --rebase -q
            git push
          fi
